# Theme Skin
skin: default   # default, night, plum, sea, soft, steel

# Navigation (main menu order)
navigation_pages:
  - _pages/about.md
  - _pages/meetings.md
  - _pages/webinars.md
  - _pages/agenda.md
  - _pages/contact.md

# Google Fonts (optional — remove entirely to use system fonts)
google_fonts:
  - name: "Fira Sans"
    weights: "400,400i,600,600i"
  - name: "Fira Sans Condensed"