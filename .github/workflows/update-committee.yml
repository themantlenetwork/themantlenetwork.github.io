name: Update scientific committee map

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:15 UTC. GitHub scheduled workflows use UTC.
    - cron: "15 6 * * 1"

permissions:
  contents: write

concurrency:
  group: update-committee-map
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download GeoNames reference data
        run: |
          mkdir -p data/reference
          curl --fail --location --retry 3 \
            https://download.geonames.org/export/dump/cities1000.zip \
            --output /tmp/cities1000.zip
          unzip -o /tmp/cities1000.zip -d data/reference
          curl --fail --location --retry 3 \
            https://download.geonames.org/export/dump/countryInfo.txt \
            --output data/reference/countryInfo.txt

      - name: Fetch Laposta members and build map
        env:
          LAPOSTA_API_KEY: ${{ secrets.LAPOSTA_API_KEY }}
        run: |
          python scripts/geocode_subscribers.py \
            --laposta \
            --snapshot /tmp/laposta_committee.private.json \
            --gazetteer data/reference/cities1000.txt \
            --country-info data/reference/countryInfo.txt \
            --output _data/members.csv \
            --review /tmp/members_review.csv \
            --keywords /tmp/keyword_inventory.csv \
            --min-members 1 \
            --max-drop-fraction 0.5

      - name: Upload private quality-control reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committee-map-review-${{ github.run_number }}
          path: |
            /tmp/members_review.csv
            /tmp/keyword_inventory.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit public map data if changed
        run: |
          if git diff --quiet -- _data/members.csv; then
            echo "No changes to committee map data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/members.csv
          git commit -m "Update scientific committee map data"
          git push
