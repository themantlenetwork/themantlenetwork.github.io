name: Update scientific committee

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: write

concurrency:
  group: update-scientific-committee-map
  cancel-in-progress: false

jobs:
  update-committee:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download GeoNames reference data
        run: |
          mkdir -p _data/reference _data/private/committee
          curl --fail --location --retry 3 \
            https://download.geonames.org/export/dump/cities1000.zip \
            --output /tmp/cities1000.zip
          unzip -o /tmp/cities1000.zip -d /tmp/geonames
          cp /tmp/geonames/cities1000.txt _data/reference/cities1000.txt
          curl --fail --location --retry 3 \
            https://download.geonames.org/export/dump/countryInfo.txt \
            --output _data/reference/countryInfo.txt

      - name: Fetch Laposta members and build committee dataset
        env:
          LAPOSTA_API_KEY: ${{ secrets.LAPOSTA_API_KEY }}
        run: |
          python scripts/geocode_members.py \
            --laposta \
            --snapshot _data/private/committee/laposta_snapshot.json \
            --gazetteer _data/reference/cities1000.txt \
            --country-info _data/reference/countryInfo.txt \
            --output _data/committee_members.csv \
            --review _data/private/committee/committee_review.csv \
            --keywords _data/private/committee/committee_keywords.csv \
            --min-members 1 \
            --max-drop-fraction 0.5

      - name: Upload committee private files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committee-private-${{ github.run_number }}
          path: _data/private/committee/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit public committee data if changed
        run: |
          if git diff --quiet -- _data/committee_members.csv; then
            echo "No changes to committee map data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/committee_members.csv
          git commit -m "Update scientific committee map data"
          git push
