name: Update Scientific Committee

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download GeoNames reference data
        run: |
          mkdir -p data/reference reports

          curl -L \
            https://download.geonames.org/export/dump/cities1000.zip \
            -o /tmp/cities1000.zip

          unzip -o /tmp/cities1000.zip -d data/reference

          curl -L \
            https://download.geonames.org/export/dump/countryInfo.txt \
            -o data/reference/countryInfo.txt

      - name: Retrieve and process committee members
        env:
          LAPOSTA_API_KEY: ${{ secrets.LAPOSTA_API_KEY }}
        run: |
          python scripts/geocode_subscribers.py \
            --laposta \
            --list-name "The MANTLE NETWORK Initiative - Scientific committee" \
            --member-state active \
            --snapshot /tmp/committee.private.json \
            --gazetteer data/reference/cities1000.txt \
            --country-info data/reference/countryInfo.txt \
            --output _data/committee_members.csv \
            --review reports/committee_review.csv \
            --keywords reports/committee_keywords.csv \
            --min-members 1 \
            --max-drop-fraction 0.5

      - name: Upload committee reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committee-review-${{ github.run_number }}
          path: |
            reports/committee_review.csv
            reports/committee_keywords.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated committee data and keywords
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _data/committee_members.csv
          git add reports/committee_keywords.csv

          if git diff --cached --quiet; then
            echo "No changes to committee data or keywords."
          else
            git commit -m "Update Scientific Committee data"
            git push
          fi