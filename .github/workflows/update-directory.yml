name: Update member directory

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-member-directory
  cancel-in-progress: false

jobs:
  update-network:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check GeoNames reference files
        run: |
          test -f _data/reference/cities1000.txt
          test -f _data/reference/countryInfo.txt

      - name: Fetch Laposta members and build network directory
        env:
          LAPOSTA_API_KEY: ${{ secrets.LAPOSTA_API_KEY }}
        run: |
          mkdir -p _data/private/network
          python scripts/geocode_members.py \
            --laposta \
            --list-name "The MANTLE NETWORK Initiative - Member directory" \
            --member-state active \
            --snapshot _data/private/network/laposta_snapshot.json \
            --gazetteer _data/reference/cities1000.txt \
            --country-info _data/reference/countryInfo.txt \
            --output _data/network_members.csv \
            --review _data/private/network/network_review.csv \
            --keywords _data/private/network/network_keywords.csv \
            --min-members 1 \
            --max-drop-fraction 0.5

      - name: Create private ZIP artifact
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          private_dir = Path("_data/private/network")
          archive_path = Path("network_private.zip")
          files = sorted(path for path in private_dir.rglob("*") if path.is_file()) if private_dir.exists() else []

          if files:
              with ZipFile(archive_path, "w", ZIP_DEFLATED) as archive:
                  for path in files:
                      archive.write(path, path.relative_to(private_dir.parent))
              print(f"Packaged {len(files)} file(s) from {private_dir}.")
          else:
              print("No private files were generated; no ZIP will be uploaded.")
          PY

      - name: Upload private ZIP artifact
        if: always() && hashFiles('network_private.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: network-private-${{ github.run_number }}
          path: network_private.zip
          if-no-files-found: error
          retention-days: 14
      - name: Commit public network data if changed
        run: |
          if git diff --quiet -- _data/network_members.csv; then
            echo "No changes to member directory data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/network_members.csv
          git commit -m "Update MANTLE NETWORK member directory"
          git push
