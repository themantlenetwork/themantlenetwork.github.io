
name: Update MANTLE NETWORK Member Directory

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:30 UTC.
    - cron: "30 6 * * 1"

permissions:
  contents: write

concurrency:
  group: update-member-directory-map
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download GeoNames reference data
        run: |
          mkdir -p data/reference
          curl --fail --location --retry 3 \
            https://download.geonames.org/export/dump/cities1000.zip \
            --output /tmp/cities1000.zip
          unzip -o /tmp/cities1000.zip -d data/reference
          curl --fail --location --retry 3 \
            https://download.geonames.org/export/dump/countryInfo.txt \
            --output data/reference/countryInfo.txt

      - name: Fetch Laposta members and build map
        env:
          LAPOSTA_API_KEY: ${{ secrets.LAPOSTA_API_KEY }}
        run: |
          python scripts/geocode_subscribers.py \
            --laposta \
            --list-name "The MANTLE NETWORK Initiative - Member directory" \
            --member-state active \
            --snapshot /tmp/laposta_directory.private.json \
            --gazetteer data/reference/cities1000.txt \
            --country-info data/reference/countryInfo.txt \
            --output _data/network_members.csv \
            --review /tmp/network_members_review.csv \
            --keywords /tmp/network_members_keywords.csv \
            --min-members 1 \
            --max-drop-fraction 0.5

      - name: Upload private quality-control reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-directory-review-${{ github.run_number }}
          path: |
            /tmp/network_members_review.csv
            /tmp/network_members_keywords.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit public map data if changed
        run: |
          if git diff --quiet -- _data/network_members.csv; then
            echo "No changes to Member Directory data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/network_members.csv
          git commit -m "Update MANTLE NETWORK Member Directory"
          git push
